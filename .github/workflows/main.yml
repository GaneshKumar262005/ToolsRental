name: ConstructHub CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  flutter-build:
    name: Flutter Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Version
        run: flutter --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project
        run: flutter analyze

      - name: Run Tests
        run: flutter test
        continue-on-error: true

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ConstructHub-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APPIUM Report
        uses: actions/upload-artifact@v4
        with:
          name: APPIUM_TEST_CASES
          path: APPIUM_TEST_CASES.xlsx
          if-no-files-found: warn

      - name: Upload Master Audit Report
        uses: actions/upload-artifact@v4
        with:
          name: MASTER_TEST_AUDIT_REPORT
          path: MASTER_TEST_AUDIT_REPORT.xlsx
          if-no-files-found: warn

      - name: Upload Final Audit Report
        uses: actions/upload-artifact@v4
        with:
          name: FINAL_AUDIT_REPORT
          path: FINAL_AUDIT_REPORT.md
          if-no-files-found: warn