name: ConstructHub CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm install

      - name: Check Server Syntax
        run: node -c server.js

      - name: Run Backend Tests
        run: npm test --if-present

  flutter:
    name: Flutter CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Version
        run: flutter --version

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Analyze Flutter Code
        run: flutter analyze

      - name: Run Flutter Tests
        run: flutter test
        continue-on-error: true

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ConstructHub-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APPIUM Report
        uses: actions/upload-artifact@v4
        with:
          name: APPIUM_TEST_CASES
          path: APPIUM_TEST_CASES.xlsx
          if-no-files-found: warn

      - name: Upload Master Audit Report
        uses: actions/upload-artifact@v4
        with:
          name: MASTER_TEST_AUDIT_REPORT
          path: MASTER_TEST_AUDIT_REPORT.xlsx
          if-no-files-found: warn

      - name: Upload Final Audit Report
        uses: actions/upload-artifact@v4
        with:
          name: FINAL_AUDIT_REPORT
          path: FINAL_AUDIT_REPORT.md
          if-no-files-found: warn